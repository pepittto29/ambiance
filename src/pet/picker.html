<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <style>
    html, body { margin: 0; height: 100%; background: rgba(10, 12, 20, 0.28); cursor: crosshair; user-select: none; }
    .hint {
      position: fixed; top: 32px; left: 50%; transform: translateX(-50%);
      padding: 14px 22px; border-radius: 8px; background: rgba(32, 32, 32, 0.92); color: #fff;
      font: 15px 'Segoe UI Variable Text', 'Segoe UI', sans-serif; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .hint b { color: #60cdff; }
  </style>
</head>
<body>
  <div class="hint">Cliquez à l'endroit où placer le <b>terrier</b> : il se posera sur la surface juste en dessous. Échap pour annuler.</div>
  <script src="picker.js"></script>
</body>
</html>
