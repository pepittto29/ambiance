<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Cadre</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Cadre décoratif du mode Rétro, posé sur tout l'écran et transparent aux clics.
//   pixel : bordure en gros pixels avec coins arrondis en escalier
//   crt   : lignes de balayage et bords assombris d'un vieil écran cathodique
const style = new URLSearchParams(location.search).get('style') || 'pixel';
const cv = document.getElementById('c');
const g = cv.getContext('2d');

function stairCorners(W, H, u, r, color) {
  g.fillStyle = color;
  for (let i = 0; i < r; i++) {
    // Rangée i depuis le bord : de moins en moins de pixels vers l'intérieur.
    const n = Math.round(r - Math.sqrt(r * r - (r - i) * (r - i)));
    if (n <= 0) continue;
    const y = i * u, w = n * u;
    g.fillRect(0, y, w, u); g.fillRect(W - w, y, w, u);
    g.fillRect(0, H - y - u, w, u); g.fillRect(W - w, H - y - u, w, u);
  }
}

function drawPixel(W, H, u) {
  const band = (off, size, color, sides = 'tlbr') => {
    g.fillStyle = color;
    const o = off * u, s = size * u;
    if (sides.includes('t')) g.fillRect(o, o, W - 2 * o, s);
    if (sides.includes('b')) g.fillRect(o, H - o - s, W - 2 * o, s);
    if (sides.includes('l')) g.fillRect(o, o, s, H - 2 * o);
    if (sides.includes('r')) g.fillRect(W - o - s, o, s, H - 2 * o);
  };
  band(0, 2, '#140c1c');
  band(2, 2, '#ff4fa3');
  band(2, 1, '#ffb3d9', 'tl'); // lumière en haut à gauche
  band(3, 1, '#c2185b', 'br'); // ombre en bas à droite
  band(4, 1, '#140c1c');
  stairCorners(W, H, u, 12, '#140c1c');
  // Petits rivets dans les coins et au milieu des côtés.
  g.fillStyle = '#fff1f8';
  const r = u * 2;
  for (const [x, y] of [[r * 2, 2.5 * u], [W - r * 2 - u, 2.5 * u], [r * 2, H - 3.5 * u], [W - r * 2 - u, H - 3.5 * u], [W / 2, 2.5 * u], [W / 2, H - 3.5 * u], [2.5 * u, H / 2], [W - 3.5 * u, H / 2]]) {
    g.fillRect(Math.round(x), Math.round(y), u, u);
  }
}

function drawCrt(W, H, u) {
  const line = Math.max(1, Math.round(u / 2));
  g.fillStyle = 'rgba(0, 0, 0, 0.1)';
  for (let y = 0; y < H; y += line * 3) g.fillRect(0, y, W, line);
  const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.hypot(W, H) / 2);
  v.addColorStop(0, 'rgba(0, 0, 0, 0)');
  v.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
  g.fillStyle = v;
  g.fillRect(0, 0, W, H);
  // Coins arrondis noirs, comme le verre bombé des vieux téléviseurs.
  const R = u * 12;
  g.fillStyle = '#000';
  g.beginPath();
  g.rect(0, 0, W, H);
  g.roundRect(0, 0, W, H, R);
  g.fill('evenodd');
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const W = cv.width = Math.round(innerWidth * dpr);
  const H = cv.height = Math.round(innerHeight * dpr);
  const u = Math.max(2, Math.round(3 * dpr));
  g.clearRect(0, 0, W, H);
  if (style === 'crt') drawCrt(W, H, u); else drawPixel(W, H, u);
}
addEventListener('resize', draw);
draw();
</script>
</body>
</html>
